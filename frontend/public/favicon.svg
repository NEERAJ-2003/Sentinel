<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background pill matching the navbar ink colour -->
  <rect width="32" height="32" rx="7" fill="#101010"/>
  <!-- ShieldCheck icon in accent yellow #E8A33D, centred, scaled to ~22px -->
  <!-- Shield outline path (lucide ShieldCheck) -->
  <path
    d="M16 3 L7 7 L7 15 C7 20.25 10.9 25.15 16 26.5 C21.1 25.15 25 20.25 25 15 L25 7 Z"
    fill="none"
    stroke="#E8A33D"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Check mark inside shield -->
  <polyline
    points="12.5,16 14.75,18.25 19.5,13.5"
    fill="none"
    stroke="#E8A33D"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
